spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/salgados
spring.datasource.username=salgados
spring.datasource.password=salgados

spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-key-with-at-least-32-bytes}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

